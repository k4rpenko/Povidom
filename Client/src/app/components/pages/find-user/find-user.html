<div class="found-user" *ngIf="find_user">
    <div *ngFor="let user of users">
        <a (click)="sendUser(user)">
            <div class="found-user-data">
                <img 
                    [src]="user.avatar || 'https://54hmmo3zqtgtsusj.public.blob.vercel-storage.com/avatar/Logo-yEeh50niFEmvdLeI2KrIUGzMc6VuWd-a48mfVnSsnjXMEaIOnYOTWIBFOJiB2.jpg'"
                    alt=""
                    class="profile-icon"
                >
                <div class="found-user-text">
                    <samp>{{ user.firstName }}</samp>
                    <samp class="-nick-name">@{{ user.userName }}</samp>
                </div>
            </div>
        </a>
    </div>
</div>
